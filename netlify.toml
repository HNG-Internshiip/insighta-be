[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler          = "esbuild"
  external_node_modules = ["pg", "pg-native"]

# /auth/* → function
[[redirects]]
  from   = "/auth/*"
  to     = "/.netlify/functions/api/auth/:splat"
  status = 200

# /api/* → function
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/api/:splat"
  status = 200

# /health → function
[[redirects]]
  from   = "/health"
  to     = "/.netlify/functions/api/health"
  status = 200